[project]
name = "asinux-sync"
version = "0.1.0"
description = "Cross-device desktop personalization sync for ASinux"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
asinux-sync-cli = "asinux_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asinux_sync*"]
